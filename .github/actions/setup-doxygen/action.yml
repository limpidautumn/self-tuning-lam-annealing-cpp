name: Setup Doxygen
description: Install Graphviz and the Doxygen version pinned by the project.

runs:
  using: composite
  steps:
    - name: Install Graphviz and Doxygen
      shell: bash
      env:
        # Keep the version in sync with the first line of Doxyfile.in.
        DOXYGEN_SHA256: 14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90
        DOXYGEN_VERSION: 1.18.0
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends graphviz

        archive="$RUNNER_TEMP/doxygen.tar.gz"
        url="https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
        curl -fsSL --retry 3 "$url" -o "$archive"
        echo "${DOXYGEN_SHA256}  ${archive}" | sha256sum -c -
        tar -xzf "$archive" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/doxygen-${DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/doxygen-${DOXYGEN_VERSION}/bin/doxygen" --version
