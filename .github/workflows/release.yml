name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-doxygen

      - name: Configure
        run: |
          for _ in 1 2 3; do
            rm -rf build
            cmake -S . -B build -DSTLAM_BUILD_DOCS=ON && exit 0
            sleep 5
          done
          exit 1

      - name: Build docs
        run: cmake --build build --target stlam_docs --parallel

      - uses: actions/upload-artifact@v7
        with:
          name: docs
          path: build/docs/html/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: docs
          path: ${{ runner.temp }}/html

      - name: Publish to gh-pages
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          project_version="$(sed -n 's/^project(.* VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n1)"
          test "$version" = "$project_version" || {
            echo "tag $TAG does not match CMake project version $project_version" >&2
            exit 1
          }

          cp scripts/pages_index.py "$RUNNER_TEMP/pages_index.py"

          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth=1 origin gh-pages && git checkout -B gh-pages FETCH_HEAD
          elif [ $? -eq 2 ]; then
            git switch --orphan gh-pages
          else
            echo "unable to access the remote repository" >&2
            exit 1
          fi

          rm -rf "$TAG"
          cp -a "$RUNNER_TEMP/html" "$TAG"

          newest="$(find . -maxdepth 1 -type d -name 'v*.*.*' -printf '%f\n' | sort -V | tail -n1)"
          if [ -z "$newest" ] || [ "$(printf '%s\n%s\n' "$TAG" "$newest" | sort -V | tail -n1)" = "$TAG" ]; then
            rm -rf latest && cp -a "$RUNNER_TEMP/html" latest
          fi

          python3 "$RUNNER_TEMP/pages_index.py" .
          git add "$TAG" index.html
          if [ -d latest ]; then git add latest; fi
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish $TAG"
          fi
          git push origin HEAD:refs/heads/gh-pages
